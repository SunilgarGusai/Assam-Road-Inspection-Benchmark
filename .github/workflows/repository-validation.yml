name: repository validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install reviewer-facing dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Validate frozen evidence
        run: python scripts/validate_frozen_package.py
      - name: Print scientific summary
        run: python scripts/summarize_key_results.py
